<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biotech News Tracker</title>
<style>
:root{
  --paper:#F6F5F1; --panel:#FFFFFF; --ink:#191C22; --ink-soft:#565C68;
  --ink-faint:#8A909C; --line:#E4E2DB; --line-soft:#EEEDE7;
  --disease:#1E6E63; --disease-bg:#E7F1EE;
  --modality:#5A45A0; --modality-bg:#ECE8F6;
  --theme:#A76A16; --theme-bg:#F6ECDC;
  --accent:var(--disease); --accent-bg:var(--disease-bg);
  --green:#2C7A4B; --green-bg:#E6F1EA;
  --shadow:0 1px 2px rgba(20,24,34,.05),0 8px 24px rgba(20,24,34,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --col-w:640px; --gap:26px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
a:hover{border-bottom-color:var(--accent)}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.area-head:focus-visible,.grp-head:focus-visible,.story-head:focus-visible{outline-offset:-2px}

/* ---------- top bar ---------- */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1500px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:11px;user-select:none}
.brand .glyph{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.5px;
  color:#fff;background:var(--ink);padding:4px 7px;border-radius:5px;line-height:1}
.brand h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:0;letter-spacing:.1px}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.3px}

.tabs{display:flex;gap:4px;background:var(--line-soft);padding:3px;border-radius:9px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;
  color:var(--ink-soft);display:flex;align-items:center;gap:7px;transition:.15s}
.tab .dot{width:8px;height:8px;border-radius:50%}
.tab[data-cat=disease] .dot{background:var(--disease)} .tab[data-cat=modality] .dot{background:var(--modality)}
.tab[data-cat=theme] .dot{background:var(--theme)}
.tab.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tab:hover:not(.active){color:var(--ink)}

.search{margin-left:auto;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:15px;height:15px;stroke:var(--ink-faint);pointer-events:none}
.search input{width:270px;max-width:44vw;padding:9px 32px 9px 33px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);font-size:13.5px;color:var(--ink);outline:none;transition:.15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search .clear{position:absolute;right:7px;border:0;background:var(--line-soft);color:var(--ink-soft);
  width:20px;height:20px;border-radius:50%;font-size:13px;line-height:1;display:none}
.search.has .clear{display:inline-flex;align-items:center;justify-content:center}

/* ---------- controls row ---------- */
.controls{max-width:1500px;margin:0 auto;padding:12px 26px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.timeline{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:2px}
.wk{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;white-space:nowrap;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:1px;line-height:1.25;transition:.15s}
.wk b{font-family:var(--sans);font-size:12.5px;color:var(--ink);font-weight:650}
.wk small{font-size:10px;color:var(--ink-faint)}
.wk.focus{border-color:var(--accent);background:var(--accent-bg);color:var(--ink)}
.wk:hover{border-color:var(--accent)}
.wk.ov-tab{margin-left:8px;border-style:dashed;border-color:var(--ink-faint);background:var(--paper);position:relative}
.wk.ov-tab::before{content:"";position:absolute;left:-8px;top:4px;bottom:4px;width:1px;background:var(--line)}
.wk.ov-tab b{color:var(--ink)}
.wk.ov-tab.focus{border-style:solid;border-color:var(--ink);background:var(--ink);}
.wk.ov-tab.focus b,.wk.ov-tab.focus small{color:#fff}
.spacer{flex:1}
.ctrl-btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:12.5px;
  font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.ctrl-btn:hover{border-color:var(--accent);color:var(--ink)}
.tgls{display:inline-flex;gap:8px;flex-wrap:wrap}
.tgl::before{content:"";width:8px;height:8px;border-radius:2px;border:1.5px solid var(--ink-faint);
  background:transparent;flex:0 0 8px;transition:background .15s,border-color .15s}
.tgl.on{border-color:var(--accent);color:var(--ink);background:var(--accent-bg)}
.tgl.on::before{background:var(--accent);border-color:var(--accent)}
.pin-note{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);
  font-family:var(--mono);background:var(--accent-bg);border:1px solid var(--accent);
  border-radius:20px;padding:4px 6px 4px 12px;margin-right:2px}
.pin-note[hidden]{display:none}
.pin-note b{color:var(--ink);font-weight:700}
.pin-note button{border:0;background:var(--panel);color:var(--ink-soft);border-radius:50%;
  width:18px;height:18px;line-height:1;font-size:11px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center}
.pin-note button:hover{color:var(--ink);background:#fff}
.grp.pinned{background:var(--accent-bg);border-left-color:var(--accent);border-left-width:2.5px;
  border-radius:0 6px 6px 0}
.grp.pinned>.grp-head .glabel{color:var(--accent)}

/* ---------- stage / carousel ---------- */
.stage{max-width:1500px;margin:14px auto 60px;padding:0 26px;position:relative;overflow:hidden}
.nav{position:absolute;top:70px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.nav svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
.nav.prev{left:8px} .nav.next{right:8px}
.nav[disabled]{opacity:.32;cursor:default}
.nav:not([disabled]):hover{border-color:var(--accent)}

.track{display:flex;gap:var(--gap);will-change:transform;transition:transform .42s cubic-bezier(.22,.61,.36,1)}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
.weekcol{width:var(--col-w);flex:0 0 var(--col-w);transition:opacity .3s,filter .3s}
.weekcol.peek{opacity:.5;filter:saturate(.7)}
.weekcol.peek .col-body{pointer-events:none}
.weekcol.peek .col-head{cursor:pointer}
.col-body{transition:transform .4s cubic-bezier(.22,.61,.36,1)}
@media (prefers-reduced-motion:reduce){.col-body{transition:none}}

.col-head{display:flex;align-items:baseline;gap:10px;padding:6px 4px 12px;border-bottom:2px solid var(--ink);
  margin-bottom:12px;position:relative}
.col-head .wlabel{font-family:var(--serif);font-size:22px;font-weight:600}
.col-head .wcount{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-left:auto}
.col-head .live{font-family:var(--mono);font-size:10px;letter-spacing:.6px;color:var(--accent);
  border:1px solid var(--accent);border-radius:4px;padding:1px 5px;text-transform:uppercase}

/* ---------- area / group / story ---------- */
.area{margin-bottom:6px;border-bottom:1px solid var(--line-soft)}
.area-head{display:flex;align-items:center;gap:9px;padding:9px 4px;width:100%;border:0;background:transparent;text-align:left}
.area-head .chev{width:14px;height:14px;flex:0 0 14px;stroke:var(--ink-faint);fill:none;stroke-width:2.2;transition:transform .18s}
.area.open .area-head .chev{transform:rotate(90deg)}
.area-head .name{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.1px}
.area-head .tag{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 9px}
.area-head .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-faint);
  background:var(--line-soft);padding:2px 7px;border-radius:20px}
.area-body{display:none;padding:0 0 8px 6px} .area.open>.area-body{display:block}

.grp{margin:2px 0 2px 6px;border-left:1.5px solid var(--line);padding-left:12px}
.grp-head{display:flex;align-items:center;gap:8px;padding:5px 2px;width:100%;border:0;background:transparent;text-align:left}
.grp-head .chev{width:12px;height:12px;flex:0 0 12px;stroke:var(--ink-faint);fill:none;stroke-width:2.4;transition:transform .18s}
.grp.open>.grp-head .chev{transform:rotate(90deg)}
.grp-head .glabel{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.1px;font-family:var(--mono)}
.grp-head .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.grp-body{display:none;padding-top:2px} .grp.open>.grp-body{display:block}

/* subgroup: a light divider between a TA and its indications (GI, Thoracic…) */
.subgrp{margin:3px 0 3px 2px}
.subgrp-head{display:flex;align-items:center;gap:7px;padding:3px 2px 3px 4px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer}
.subgrp-head .chev{width:11px;height:11px;flex:0 0 11px;stroke:var(--ink-faint);fill:none;stroke-width:2.4;transition:transform .18s}
.subgrp.open>.subgrp-head .chev{transform:rotate(90deg)}
.subgrp-head .sglabel{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-faint)}
.subgrp-head .n{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}
.subgrp-head:hover .sglabel{color:var(--ink)}
.subgrp-body{display:none;padding-left:4px;border-left:1px dotted var(--line);margin-left:5px} .subgrp.open>.subgrp-body{display:block}
.subgrp-body>.grp{margin-left:4px}

/* overview / index column (always past the latest week) */
.weekcol.overview{}
.col-head.ov-head .live.idx{background:var(--ink);color:#fff}
.ov-body{padding:4px 2px 24px}
.ov-ind{margin:2px 0 6px 6px;border-left:2px solid var(--line);padding-left:10px}
.ov-ind-head{display:flex;align-items:center;gap:8px;padding:4px 2px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:5px}
.ov-ind-head:hover{background:var(--accent-bg)}
.ov-ind-head .ov-ind-name{font-size:12.5px;font-weight:700;color:var(--accent);font-family:var(--mono)}
.ov-ind-head .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.ov-ind.misc .ov-ind-head .ov-ind-name{color:var(--ink-faint)}
.ov-blurb{padding:1px 2px 3px 2px;display:flex;flex-direction:column;gap:2px}
.ov-l{font-size:11px;line-height:1.35;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.ov-tag{font-size:8.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-faint);
  border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--paper)}
.ov-l b{color:var(--ink);font-weight:600}
.ov-bal .up{color:#1d6b3f;font-weight:600}.ov-bal .dn{color:#b3261e;font-weight:600}
.ov-bal .ov-tot{color:var(--ink-faint);margin-left:auto;font-family:var(--mono);font-size:10px}
.ov-trend .tr{font-size:10.5px;padding:1px 5px;border-radius:9px;font-weight:600}
.ov-trend .tr.up{background:#e6f1ea;color:#1d6b3f}
.ov-trend .tr.dn{background:#fbe9e7;color:#b3261e}
.ov-trend .tr.ct{background:#fff4e0;color:#8a5a00}

.story{border-left:2px solid var(--accent);margin:6px 0;padding-left:12px}
.story-head{display:flex;gap:9px;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:3px 2px}
.story-head .tw{width:13px;height:13px;flex:0 0 13px;margin-top:3px;stroke:var(--ink-faint);fill:none;stroke-width:2.2;transition:transform .18s}
.story.open .story-head .tw{transform:rotate(90deg)}
.story-title{font-size:13.7px;line-height:1.42;color:var(--ink)}
.story-title.neg{color:#b3261e}
.co{background:#FFE816;color:#1b1b1b;font-weight:700;border-radius:3px;
  padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.co.concept{background:#E9DDFB;color:#5b3aa6;box-shadow:inset 0 -2px 0 #C9AEF2}
.co.concept::after{content:"◇";font-size:9px;margin-left:3px;vertical-align:1px;opacity:.75}
.story.hasdetail .story-title{cursor:pointer}
.mktcap{display:inline-block;margin-left:7px;font-family:var(--mono);font-size:10.5px;font-weight:700;
  letter-spacing:.3px;color:#fff;background:#12924e;border:1px solid #0f7d43;
  border-radius:5px;padding:1px 7px;white-space:nowrap;vertical-align:1px;
  box-shadow:0 1px 1px rgba(16,90,50,.18)}
.mktcap.small{color:#5b6270;background:#eceef1;border-color:#dfe2e8;box-shadow:none;font-weight:600}
.mktcap.nosize{color:#8a5a12;background:#f8edd6;border-color:#ecd9b0;box-shadow:none;font-weight:600}
/* estimated (model) figures: same shape, hollow + dashed so they read as estimates */
.mktcap.est{background:transparent;border-style:dashed;box-shadow:none;cursor:help}
.mktcap.est.big{color:#0f7d43;border-color:#12924e}
.mktcap.est.small{color:#5b6270;border-color:#c7ccd4;background:transparent}
.detail{display:none;margin:4px 0 10px 26px}
.story.open .detail{display:block}
.detail ul{margin:3px 0;padding-left:16px}
.detail li{font-size:12.6px;color:var(--ink-soft);line-height:1.45;margin:2px 0}
.detail li::marker{color:var(--ink-faint)}

.empty{color:var(--ink-faint);font-size:12.5px;font-style:italic;padding:14px 4px}

/* ---------- search results ---------- */
.results{max-width:1040px;margin:16px auto 70px;padding:0 26px}
.res-summary{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin:4px 0 16px}
.res-summary b{color:var(--ink)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 20px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 13px;font-size:12.5px;color:var(--ink-soft)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.res-group{margin-bottom:22px}
.res-group h3{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 3px;display:flex;align-items:center;gap:9px}
.res-group .catdot{width:9px;height:9px;border-radius:50%}
.res-group .crumb{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin:0 0 10px;padding-left:18px}
.res-card{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:12px 15px;margin:8px 0;box-shadow:var(--shadow)}
.res-card .rt{font-size:13.8px;line-height:1.45}
.res-card .rmeta{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.res-card .rweek{font-family:var(--mono);font-size:10.5px;color:#fff;background:var(--accent);padding:2px 7px;border-radius:4px}
.res-card details{margin-top:7px}
.res-card summary{font-family:var(--mono);font-size:11px;color:var(--ink-faint);cursor:pointer;list-style:none}
.res-card summary::-webkit-details-marker{display:none}
.res-card summary:hover{color:var(--accent)}
.res-card .detail{display:block;margin-top:6px}
mark{background:#FBE7A6;color:inherit;padding:0 1px;border-radius:2px}

/* ---- search timeline ---- */
.tl{position:relative;margin-top:6px}
.tl-month{position:relative;padding-left:26px;margin-bottom:6px}
.tl-month::before{content:"";position:absolute;left:6px;top:14px;bottom:-6px;width:2px;background:var(--line)}
.tl-month:last-child::before{display:none}
.tl-mhead{display:flex;align-items:center;gap:10px;margin:14px 0 8px;position:relative}
.tl-dot{position:absolute;left:-26px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;
  background:var(--panel);border:2.5px solid var(--accent);box-shadow:0 0 0 4px var(--paper)}
.tl-mlabel{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink)}
.tl-mn{font-size:11px;color:var(--ink-faint)}
.tl-mn::before{content:"";display:inline-block}
.tl-items{display:flex;flex-direction:column;gap:7px}
.tl-item{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.tl-head{width:100%;display:flex;align-items:flex-start;gap:10px;padding:10px 13px;background:none;border:none;
  text-align:left;cursor:pointer;font:inherit;color:inherit}
.tl-head.bare{cursor:default}
.tl-head:hover:not(.bare){background:var(--accent-bg)}
.tl-cat{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px}
.tl-week{flex:none;font-size:10.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);
  padding:2px 7px;border-radius:5px;margin-top:1px}
.tl-main{flex:1;min-width:0}
.tl-title{font-size:13.6px;line-height:1.42;color:var(--ink)}
.tl-title.neg{color:#b3261e}
.tl-crumb{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:3px}
.tl-chev{flex:none;color:var(--ink-faint);margin-top:2px;transition:transform .18s}
.tl-item.open .tl-chev{transform:rotate(90deg)}
.tl-body{display:none;padding:0 13px 12px 31px}
.tl-item.open .tl-body{display:block}
.tl-body .detail{display:block}
@media (prefers-reduced-motion:reduce){.tl-chev{transition:none}}

.footer{max-width:1500px;margin:0 auto;padding:30px 26px 50px;color:var(--ink-faint);font-size:11.5px;
  font-family:var(--mono);border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.footer .leg{display:flex;gap:6px;align-items:center}
.footer .sw{width:10px;height:10px;border-radius:2px;display:inline-block}

@media (max-width:760px){
  :root{--col-w:86vw;--gap:14px}
  .brand h1{font-size:17px} .brand .sub{display:none}
  .search input{width:150px}
  .nav{top:56px}
}
/* ---- grp header + toast ---- */
.grp-head .n{margin-left:auto}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);z-index:60;
  background:var(--ink);color:#fff;font-size:12.5px;padding:10px 16px;border-radius:9px;
  box-shadow:0 6px 24px rgba(20,24,34,.22);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- analysis side panel ---- */
:root{--panel-w:380px;--hdr-h:62px}
.sidepanel{position:fixed;top:var(--hdr-h);right:0;width:var(--panel-w);height:calc(100vh - var(--hdr-h));
  background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(20,24,34,.06);
  z-index:30;overflow-y:auto;transform:translateX(100%);transition:transform .32s cubic-bezier(.22,.61,.36,1);
  overscroll-behavior:contain}
body.has-panel .sidepanel{transform:none}
body.has-panel main{padding-right:var(--panel-w)}
body.has-panel #controls{padding-right:calc(var(--panel-w) + 8px)}
body.has-panel .footer{padding-right:var(--panel-w)}
.ctrl-div{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.ctrl-btn.flt{color:var(--ink-soft);gap:0}
.ctrl-btn.flt.on{border-color:#0f7d43;color:#0f7d43;background:#E6F1EA}
@media (prefers-reduced-motion:reduce){.sidepanel{transition:none}}
.sp-head{position:sticky;top:0;background:var(--panel);border-bottom:1.5px solid var(--ink);padding:14px 16px 11px;z-index:2}
.sp-crumb{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
.sp-title{font-family:var(--serif);font-size:21px;line-height:1.12;color:var(--ink);margin:2px 0 0}
.sp-close{position:absolute;top:12px;right:12px;width:26px;height:26px;border:1px solid var(--line);

.sp-stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.sp-stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-width:0}
.sp-stat b{font-size:15px;color:var(--ink);display:block;line-height:1.1}
.sp-stat.pos b{color:#2C7A4B}.sp-stat.neg b{color:#b3261e}
.sp-stat span{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px}
.sp-body{padding:4px 16px 48px}
.sp-sec{margin-top:18px}
.sp-sec-h{font-family:var(--serif);font-size:14.5px;color:var(--ink);margin:0 0 3px;display:flex;align-items:baseline;gap:7px}
.sp-sec-sub{font-size:10.5px;color:var(--ink-faint);font-family:var(--sans)}
.sp-sec-bar{height:1.5px;background:var(--ink);margin:5px 0 9px;opacity:.85}

.sp-mo-sum{font-size:11px;color:var(--ink-soft);margin-bottom:9px}

.sp-mo-sum .u{color:#2C7A4B;font-weight:600}.sp-mo-sum .d{color:#b3261e;font-weight:600}
.sp-mo{display:flex;gap:5px;align-items:flex-end;height:78px}
.sp-mo-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.sp-mo-bar{width:74%;max-width:30px;min-height:2px;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;background:var(--line-soft)}
.sp-mo-bar .u{background:#2C7A4B}.sp-mo-bar .z{background:#c9cdd4}.sp-mo-bar .d{background:#d1544a}
.sp-mo-k{font-family:var(--mono);font-size:8px;color:var(--ink-faint);margin-top:4px;white-space:nowrap}
.sp-mo-n{font-size:8.5px;color:var(--ink-faint);font-weight:700}
.sp-mo-leg{font-size:9px;color:var(--ink-faint);margin-top:7px;font-family:var(--mono)}
.sp-mo-leg .u{color:#2C7A4B}.sp-mo-leg .z{color:#c9cdd4}.sp-mo-leg .d{color:#d1544a}

.sp-dir{border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:8px 11px;margin-bottom:8px;background:var(--panel)}
.sp-dir.transfer{border-left-color:#5b3aa6}.sp-dir.failure{border-left-color:#b3261e}
.sp-dir.crowd{border-left-color:#d98324}.sp-dir.leader{border-left-color:#2C7A4B}
.sp-dir-t{font-weight:700;font-size:12px;color:var(--ink)}
.sp-dir-b{font-size:11px;line-height:1.55;color:var(--ink-soft);margin-top:3px}
.sp-dir-b b{color:var(--ink)}
/* concept trajectory rows */
.sp-con{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:7px;background:var(--panel)}
.sp-con-h{display:flex;align-items:center;gap:7px}
.sp-con-ar{font-size:13px;font-weight:800;flex:0 0 auto;width:15px;text-align:center}
.sp-con.rising .sp-con-ar{color:#2C7A4B}.sp-con.falling .sp-con-ar{color:#b3261e}
.sp-con.contested .sp-con-ar{color:#c17d10}.sp-con.emerging .sp-con-ar{color:#5b6270}
.sp-con-k{font-weight:700;font-size:12.5px;color:var(--ink);flex:1;min-width:0}
.sp-con-tag{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:9px;flex:0 0 auto}
.sp-con.rising .sp-con-tag{background:#E6F1EA;color:#2C7A4B}
.sp-con.falling .sp-con-tag{background:#fbe9e7;color:#b3261e}
.sp-con.contested .sp-con-tag{background:#fcf0db;color:#9a5a12}
.sp-con.emerging .sp-con-tag{background:#eef0f3;color:#5b6270}
.sp-con-ev{margin:5px 0 0;padding-left:22px;list-style:none}
.sp-con-ev li{font-size:11px;line-height:1.45;color:var(--ink-soft);margin:2px 0;display:flex;gap:6px}
.sp-con-ev .mk{flex:0 0 auto;font-weight:700}
.sp-con-ev .mk.u{color:#2C7A4B}.sp-con-ev .mk.d{color:#b3261e}.sp-con-ev .mk.z{color:var(--ink-faint)}
.sp-con-ev .ew{flex:0 0 auto;font-family:var(--mono);font-size:9px;color:var(--ink-faint);margin-top:1px}
.sp-con-ev .et{flex:1;min-width:0}
.sp-con-ev .et b{color:var(--ink);font-weight:600}
.nk{font-family:var(--mono);font-size:9px;padding:0 4px;border-radius:3px}
.nk.good{color:#1d6b3f;background:#e6f1ea}.nk.bad{color:#b3261e;background:#fbe9e7}.nk.neu{color:#5b6270;background:#eceef1}
.ev-click{cursor:pointer;border-radius:6px;transition:background .12s}
.ev-click:hover{background:var(--accent-bg)}
.ev-go{margin-left:auto;color:var(--ink-faint);font-size:11px;opacity:0;transition:opacity .12s}
.ev-click:hover .ev-go{opacity:1}
.sp-con-ev li.ev-click{padding:2px 4px;margin:0 -4px}
.story.flash{animation:flashbg 1.5s ease-out}

/* frontier + timeline compact rows */
.sp-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.sp-row:last-child{border-bottom:0}
.sp-row-wk{flex:0 0 auto;font-family:var(--mono);font-size:9px;color:var(--ink-soft);background:var(--paper);

.sp-row-m{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}

.sp-mc.nkk.neu{background:#eef2ff;color:#3d4a8a;border-color:#dde3fb}

.sp-mc.seg.white{background:var(--panel);color:#5b3aa6;border:1px dashed #b79be0}

.sp-syn{font-size:11px;line-height:1.55;color:var(--ink-soft);margin-bottom:9px}

.sp-cov-h.ws{color:#5b3aa6;margin-top:9px}
.sp-cov-l{font-size:11px;color:var(--ink-soft);line-height:1.6}
.sp-cov-ws{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.sp-dir.subpop{border-left-color:#2b6796}.sp-dir.rescue{border-left-color:#9a5a12}

.sp-ws{font-size:11px;color:var(--ink-soft);line-height:1.7;margin-bottom:10px}
.sp-ws b{color:var(--ink)}
.sp-ws .gap{color:#5b3aa6}

.sp-copy-sub{font-size:10.5px;color:var(--ink-faint);text-align:center;margin-top:6px;line-height:1.4}

  body.has-panel main,body.has-panel #controls,body.has-panel .footer{padding-right:0}

<script>
(function(){
"use strict";
const DATA = (window.BIOTECH_DATA||{weeks:[]});
const WEEKS = DATA.weeks.slice().sort((a,b)=>a.meta.sort-b.meta.sort);
const CAT_LABEL={disease:'Diseases',modality:'Modalities',theme:'Themes'};
const CAT_VAR={disease:'--disease',modality:'--modality',theme:'--theme'};
const CAT_BG={disease:'--disease-bg',modality:'--modality-bg',theme:'--theme-bg'};

// canonical ordering so the same area sits in the same place across weeks
const ORDER={disease:['Cancer','Cardio','Immuno','Neuro','Metabolic','Infectious','Respiratory','Eye','Muscle','Bone','Blood','Kidney','Derm','Skin','Hearing','Pain','Psych',"Women's health",'Aging'],
  modality:['Cell therapy','Gene therapy','Gene editing','Drug delivery','Antibody','Devices','AI discovery','AI drug discovery','Techbio','Platforms'],
  theme:['Big Pharma','China','Pricing','Regulatory','Policy','Payors','Markets','Commercialization','Clinical trials','Distribution','Healthcare delivery','Consumer health','Research funding','EU','Preclinical','Restructuring','Funds','Healthcare']};
function areaSort(cat,areas){
  const ord=ORDER[cat]||[];
  return areas.slice().sort((a,b)=>{
    let ia=ord.indexOf(a.area), ib=ord.indexOf(b.area);
    if(ia<0)ia=99; if(ib<0)ib=99;
    if(ia!==ib)return ia-ib;
    return countStories(b.children)-countStories(a.children);
  });
}
function countStories(nodes){let n=0;for(const x of nodes){n+= x.type==='story'?1:countStories(x.children);}return n;}

// Global disease frequency per area so the SAME disease sits in the SAME place
// in every week column -> you can scan across weeks and follow one disease.
const DISEASE_RANK=(function(){
  const m={};
  function eachGroup(nodes,fn){ (nodes||[]).forEach(n=>{
    if(n.type==='group')fn(n); else if(n.type==='subgroup')eachGroup(n.children,fn); }); }
  WEEKS.forEach(w=>(w.categories.disease||[]).forEach(a=>{
    const mm=m[a.area]||(m[a.area]={});
    eachGroup(a.children,g=>{ mm[g.label]=(mm[g.label]||0)+countStories(g.children); });
  }));
  return m;
})();
// Sort a disease-level node list. Works whether the list is subgroups (sort by
// their fixed `order`, Other last, and recurse-sort each subgroup's indications)
// or plain indication groups (most-common disease first, Misc. last).
function sortDiseaseGroups(area,nodes){
  if(nodes.some(n=>n.type==='subgroup')){
    return nodes.slice().sort((a,b)=>{
      const ao=a.label==='Other', bo=b.label==='Other';
      if(ao!==bo)return ao?1:-1;
      return (a.order!=null?a.order:99)-(b.order!=null?b.order:99);
    });
  }
  const rank=DISEASE_RANK[area]||{};
  return nodes.slice().sort((a,b)=>{
    const am=a.label==='Misc.', bm=b.label==='Misc.';
    if(am!==bm)return am?1:-1;               // Misc. always last
    const d=(rank[b.label]||0)-(rank[a.label]||0);  // most-common disease first
    if(d)return d;
    return a.label.localeCompare(b.label);
  });
}

// Union of every area -> subgroup -> indication seen across all weeks, for the
// persistent overview column. Subgroups keep their fixed order; indications carry
// a total story count. Areas with no subgroup scheme store indications under ''.
const OVERVIEW_TREE=(function(){
  const areas={};
  WEEKS.forEach(w=>(w.categories.disease||[]).forEach(a=>{
    const A=areas[a.area]||(areas[a.area]={subs:{}, order:{}, hasSub:false, total:0});
    function addInd(sg,g){ const S=A.subs[sg]||(A.subs[sg]={}); S[g.label]=(S[g.label]||0)+countStories(g.children); A.total+=countStories(g.children); }
    (a.children||[]).forEach(node=>{
      if(node.type==='subgroup'){ A.hasSub=true; A.order[node.label]=node.order;
        (node.children||[]).forEach(g=>{ if(g.type==='group')addInd(node.label,g); }); }
      else if(node.type==='group'){ addInd('', node); }
    });
  }));
  return areas;
})();

const BIG_MKT=750; // $millions; a drug at/above this peak-sales figure is "interesting"
const LEVEL_DEFAULT={area:true, sub:true, grp:true, story:false}; // areas/subgroups/indications open, details closed
const state={cat:'disease', focus:Math.min(1,WEEKS.length-1), search:'',
  levelOpen:Object.assign({},LEVEL_DEFAULT), flip:new Set(), pin:null, panel:null, bigOnly:false};
function passesFilter(n){ return !state.bigOnly || (n.mkt!=null && n.mkt>=BIG_MKT); }
function isOpen(level,key){ return state.levelOpen[level] !== state.flip.has(key); }
function levelPrefix(level){ return (level==='area'?'a':level==='sub'?'b':level==='grp'?'g':'s')+'|'; }

/* ---------- helpers ---------- */
function setAccent(cat){
  document.documentElement.style.setProperty('--accent','var('+CAT_VAR[cat]+')');
  document.documentElement.style.setProperty('--accent-bg','var('+CAT_BG[cat]+')');
}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
// Wrap the leading company name in a highlight span, if the (already HTML-escaped)
// title begins with it. `company` is null when the story shouldn't be highlighted.
function escCo(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// highlight class for a story's company name: yellow for a big-market opportunity,
// violet for a concept/platform worth watching, none otherwise or when negative.
function coClass(node){
  if(node.neg) return null;                       // red headline is the signal
  if(!node.interesting || !node.company) return null;
  return node.mkt!=null ? 'co' : 'co concept';
}
function withCompany(titleHtml, company, cls){
  if(!company || !cls) return titleHtml;
  const esc=escCo(company);
  if(esc && titleHtml.slice(0,esc.length)===esc)
    return '<span class="'+cls+'">'+esc+'</span>'+titleHtml.slice(esc.length);
  return titleHtml;
}
// market-size chip: green >=$750M, grey below, amber "no size" for an unquantified
// drug/concept. Appends to the given title element.
function appendMkt(el_, node){
  if(node.mkt!=null && node.mktLabel){
    const est=node.mstatus==='est';
    const c=el('span','mktcap'+(node.mkt>=BIG_MKT?' big':' small')+(est?' est':''), node.mktLabel);
    if(est && node.mktEst) c.title=node.mktEst;   // show the model derivation on hover
    el_.appendChild(c);
  } else if(node.mstatus==='unquant'){
    const c=el('span','mktcap nosize','◇ no size'); el_.appendChild(c);
  }
}
const CHEV='<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const TWCHEV='<svg class="tw" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- carousel geometry ---------- */
function layout(){
  const track=document.getElementById('track');
  const stage=document.getElementById('stage');
  const cols=track.children;
  if(!cols.length)return;
  if(state.focus>cols.length-1) state.focus=cols.length-1;   // clamp (e.g. after switching category drops the overview col)
  if(state.focus<0) state.focus=0;
  const stageW=stage.clientWidth - 52; // minus padding
  const cs=getComputedStyle(document.documentElement);
  let colW=parseFloat(cs.getPropertyValue('--col-w'));
  if(cs.getPropertyValue('--col-w').includes('vw')) colW=window.innerWidth*parseFloat(cs.getPropertyValue('--col-w'))/100;
  const gap=parseFloat(cs.getPropertyValue('--gap'));
  const off = (stageW/2) - (state.focus*(colW+gap)) - (colW/2);
  track.style.transform='translateX('+off+'px)';
  [...cols].forEach((c,i)=>c.classList.toggle('peek', i!==state.focus));
  document.getElementById('navPrev').disabled = state.focus<=0;
  document.getElementById('navNext').disabled = state.focus>=cols.length-1;
  renderTimeline();
}

/* ---------- render tree ---------- */
function keyArea(cat,area){return 'a|'+cat+'|'+area;}
function keySub(cat,path){return 'b|'+cat+'|'+path;}
function keyGrp(cat,path){return 'g|'+cat+'|'+path;}
function keyStory(wid,cat,path){return 's|'+wid+'|'+cat+'|'+path;}

function renderNodes(nodes,cat,wid,pathPrefix,areaName,curDisease){
  const frag=document.createDocumentFragment();
  nodes.forEach((node,idx)=>{
    const path=pathPrefix+'>'+ (node.label||('#'+idx));
    if(node.type==='subgroup'){
      const bk=keySub(cat,path);
      const sgEl=el('div','subgrp'+(isOpen('sub',bk)?' open':''));
      const sh=el('button','subgrp-head');
      sh.innerHTML=CHEV+'<span class="sglabel"></span><span class="n mono"></span>';
      sh.querySelector('.sglabel').textContent=node.label;
      sh.querySelector('.n').textContent=countStories(node.children);
      sh.addEventListener('click',()=>flipLevel('sub',bk,sgEl));
      sgEl.appendChild(sh);
      const sb=el('div','subgrp-body');
      const kids=cat==='disease'?sortDiseaseGroups(areaName,node.children):node.children;
      sb.appendChild(renderNodes(kids,cat,wid,path,areaName,curDisease));
      sgEl.appendChild(sb);
      if(state.bigOnly && !sb.querySelector('.story')) return;
      frag.appendChild(sgEl);
      return;
    }
    if(node.type==='group'){
      const gk=keyGrp(cat,path);
      const g=el('div','grp'+(isOpen('grp',gk)?' open':''));
      g.dataset.area=areaName; g.dataset.label=node.label;
      if(state.pin && state.pin.area===areaName && state.pin.disease===node.label) g.classList.add('pinned');
      const head=el('button','grp-head');
      head.innerHTML=CHEV+'<span class="glabel"></span><span class="n mono"></span>';
      head.querySelector('.glabel').textContent=node.label;
      head.querySelector('.n').textContent=countStories(node.children);
      head.addEventListener('click',()=>{ flipLevel('grp',gk,g);
        if(cat==='disease' && node.label!=='Misc.') openPanel(areaName,node.label);
        else setPin(areaName,node.label); });
      g.appendChild(head);
      const body=el('div','grp-body');
      body.appendChild(renderNodes(node.children,cat,wid,path,areaName,node.label));
      g.appendChild(body);
      // with the ≥$750M filter on, hide indications that have no qualifying story
      if(state.bigOnly && !body.querySelector('.story')) return;
      frag.appendChild(g);
    }else{
      if(!passesFilter(node)) return;
      const has=node.details&&node.details.length;
      const sk=keyStory(wid,cat,path+'#'+idx);
      const s=el('div','story'+(has?' hasdetail':'')+(isOpen('story',sk)?' open':''));
      if(node._uid) s.dataset.uid=node._uid;
      const head=el('button','story-head');
      head.appendChild(el('span',null, has?TWCHEV:'<span class="tw" style="opacity:0"></span>'));
      const body=el('div');
      const t=el('div','story-title'+(node.neg?' neg':''));
      t.innerHTML=withCompany(node.title, node.company, coClass(node));
      appendMkt(t, node);
      body.appendChild(t);
      head.appendChild(body);
      head.addEventListener('click',()=>{ if(has)flipLevel('story',sk,s);
        if(curDisease){ if(cat==='disease'&&curDisease!=='Misc.') openPanel(areaName,curDisease); else setPin(areaName,curDisease); } });
      if(!has && !curDisease) head.style.cursor='default';
      s.appendChild(head);
      if(has){
        const d=el('div','detail'); d.appendChild(detailList(node.details)); s.appendChild(d);
      }
      frag.appendChild(s);
    }
  });
  return frag;
}
function detailList(details){
  const ul=el('ul');
  details.forEach(d=>{
    const li=el('li',null,d.html);
    if(d.children&&d.children.length) li.appendChild(detailList(d.children));
    ul.appendChild(li);
  });
  return ul;
}

function renderColumn(week){
  const col=el('div','weekcol');
  const head=el('div','col-head');
  const isLast = WEEKS.indexOf(week)===WEEKS.length-1;
  head.innerHTML='<span class="wlabel"></span>'+(isLast?'<span class="live">latest</span>':'')+'<span class="wcount mono"></span>';
  head.querySelector('.wlabel').textContent=week.meta.label;
  const areas=areaSort(state.cat, week.categories[state.cat]||[]);
  head.querySelector('.wcount').textContent=areas.reduce((a,x)=>a+countStories(x.children),0)+' stories';
  head.addEventListener('click',()=>{ // clicking a peek focuses it
    navTo(WEEKS.indexOf(week));
  });
  col.appendChild(head);
  const bodyWrap=el('div','col-body');
  if(!areas.length){ bodyWrap.appendChild(el('div','empty','No '+CAT_LABEL[state.cat].toLowerCase()+' items this week.')); }
  areas.forEach(area=>{
    const ak=keyArea(state.cat,area.area);
    const wrap=el('div','area'+(isOpen('area',ak)?' open':''));
    const ah=el('button','area-head');
    ah.innerHTML=CHEV+'<span class="tag"></span><span class="name"></span><span class="n mono"></span>';
    ah.querySelector('.name').textContent=area.area;
    ah.querySelector('.n').textContent=countStories(area.children);
    ah.addEventListener('click',()=>flipLevel('area',ak,wrap));
    wrap.appendChild(ah);
    const ab=el('div','area-body');
    const kids=state.cat==='disease'?sortDiseaseGroups(area.area,area.children):area.children;
    ab.appendChild(renderNodes(kids,state.cat,week.meta.id,area.area,area.area,null));
    wrap.appendChild(ab);
    if(state.bigOnly && !ab.querySelector('.story')) return;   // hide empty areas when filtering
    bodyWrap.appendChild(wrap);
  });
  col.appendChild(bodyWrap);
  return col;
}

/* ---------- persistent overview / index column (always past the latest week) ---------- */
// A compact, cross-week synthesis line for one indication: the frontier leader,
// the advancing/setback balance, and the top rising & failing concepts.
function frontierBlurb(area,disease){
  const I=indicationInsight(area,disease);
  if(!I) return null;
  const out={};
  if(I.leader){ const lb=leaderBits(I.leader), n=I.leader.node;
    out.leader=lb.co+(n.efficacy?(' — '+n.efficacy):(lb.sub?(' — '+lb.sub):'')); }
  out.adv=I.advancing; out.set=I.setbacks; out.n=I.rows.length;
  const cons=conceptTrajectories(I.rows);
  const rising=cons.find(c=>c.cls==='rising'||c.cls==='emerging');
  const falling=cons.find(c=>c.cls==='falling'||c.cls==='struggling');
  out.rising=rising?rising.key:null; out.falling=falling?falling.key:null;
  out.contested=(cons.find(c=>c.cls==='contested')||{}).key||null;
  return out;
}
function ovIndRow(area,disease,count){
  const isMisc=disease==='Misc.';
  const row=el('div','ov-ind'+(isMisc?' misc':''));
  const head=el('button','ov-ind-head');

// Give each week column its own vertical shift so the followed indication sits on
// the SAME row in every column -> you can glance left/right to the prev/next week.
function alignPinned(smooth){
  const bodies=[...document.querySelectorAll('#track .col-body')];
  // Measure each week's NATURAL position with the shift transition turned off,
  // otherwise a re-align reads a mid-animation position and misaligns.
  bodies.forEach(b=>{ b.style.transition='none'; b.style.transform=''; });
  if(!state.pin){ void document.body.offsetHeight; bodies.forEach(b=>{ b.style.transition=''; }); return; }
  const cols=[...document.querySelectorAll('#track .weekcol')];
  const focusCol=cols[state.focus];
  const found=[];
  cols.forEach(c=>{
    const body=c.querySelector('.col-body');
    const g=[...c.querySelectorAll('.grp')].find(x=>x.dataset.area===state.pin.area && x.dataset.label===state.pin.disease);
    if(g && body){
      const area=g.closest('.area'); if(area) area.classList.add('open');
      g.classList.add('open');
      found.push({body,g,col:c});
    }
  });
  if(!found.length){ bodies.forEach(b=>{ b.style.transition=''; }); return; }
  void document.getElementById('track').offsetHeight; // reflow after reset + opening groups
  found.forEach(f=>{ f.A=f.g.getBoundingClientRect().top+window.scrollY; });
  // Anchor to the week the user clicked (the focused column); every OTHER week
  // shifts to match it. Fall back to the topmost if the focused week lacks it.
  let ref=null; found.forEach(f=>{ if(f.col===focusCol) ref=f.A; });
  if(ref===null) ref=Math.min(...found.map(f=>f.A));
  bodies.forEach(b=>{ b.style.transition=''; }); // restore transition for the animated move
  found.forEach(f=>{ f.body.style.transform='translateY('+(ref-f.A)+'px)'; });
  window.scrollTo({top:Math.max(0,ref-headerOffset()), behavior: smooth?'smooth':'auto'});
}
function navTo(i){

  if(i<0||i>=nCols||i===state.focus)return;
  state.focus=i; layout();

  // visible ones) onto the same row, so switching weeks needs no vertical move.
}

/* ---------- search ---------- */
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function flatten(){ // one-time flat index of every story across all weeks/cats
  const rows=[];
  WEEKS.forEach(w=>{
    ['disease','modality','theme'].forEach(cat=>{
      (w.categories[cat]||[]).forEach(area=>{
        walk(area.children,[area.area]);
        function walk(nodes,crumbs){
          nodes.forEach(node=>{
            if(node.type==='subgroup')walk(node.children,crumbs);  // subgroup not a crumb
            else if(node.type==='group')walk(node.children,crumbs.concat(node.label));
            else{
              node._uid='u'+rows.length;           // stable id for click-to-navigate
              const detailText=collectText(node.details);
              rows.push({week:w,cat,crumbs:crumbs.slice(),title:node.title,node:node,
                mkt:node.mkt,mktLabel:node.mktLabel,neg:node.neg,company:node.company,
                interesting:node.interesting,mstatus:node.mstatus,
                details:node.details, text:(stripTags(node.title)+' '+crumbs.join(' ')+' '+detailText).toLowerCase()});
            }
          });
        }
      });
    });
  });
  return rows;
}
function stripTags(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent||'';}
function collectText(details){let t='';(details||[]).forEach(d=>{t+=' '+stripTags(d.html)+collectText(d.children);});return t;}
let INDEX=null;

function highlight(html,terms){
  if(!terms.length)return html;
  // highlight in text nodes only
  const div=document.createElement('div');div.innerHTML=html;
  const rx=new RegExp('('+terms.map(esc).join('|')+')','ig');
  (function rec(node){
    for(const child of [...node.childNodes]){
      if(child.nodeType===3){
        const span=document.createElement('span');
        span.innerHTML=child.nodeValue.replace(rx,'<mark>$1</mark>');
        if(span.innerHTML!==child.nodeValue) child.replaceWith(...span.childNodes);
      }else if(child.nodeType===1 && child.tagName!=='MARK'){rec(child);}
    }
  })(div);
  return div.innerHTML;
}

const MONTHNAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(y,mo){ return (MONTHNAMES[(mo||1)-1]||'')+' '+y; }
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- events ---------- */
/* ============ per-indication distilled insight (inline, no separate page) ============ */
const ALL_MODALITIES=['Monoclonal Ab','Bispecific Ab','ADC','T-cell engager','CAR-T',
  'TCR-T','Cell therapy','Gene therapy','Base editing','CRISPR/editing','siRNA/RNAi',
  'ASO/antisense','mRNA','Protein degrader','Radiopharma','Peptide','Small molecule',
  'Enzyme/ERT','Vaccine','BCI/device','Diagnostic'];
// distinct platform modalities worth flagging as a cross-indication transfer
// (excludes ubiquitous classes like antibodies / small molecules / diagnostics)
const NOVEL_PLATFORMS=new Set(['CAR-T','TCR-T','Cell therapy','Gene therapy','Base editing',
  'CRISPR/editing','siRNA/RNAi','ASO/antisense','mRNA','Protein degrader','Radiopharma',
  'Peptide','Enzyme/ERT','Vaccine']);

function collectIndication(area,disease){
  if(!INDEX)INDEX=flatten();
  return INDEX.filter(r=>r.cat==='disease'&&r.crumbs[0]===area&&r.crumbs[1]===disease);
}
function frontierScore(r){
  // best-in-disease = most advanced + best data + biggest market
  const n=r.node; let s=(n.stageRank||0)*8;
  if(n.pos)s+=8;
  if(n.mkt)s+=Math.min(n.mkt/400,16);   // $6.4B+ caps; $3.4B≈8.5, $500M≈1.3
  if(n.interesting)s+=3;
  return s;
}
function tally(rows,field){
  const m={}; rows.forEach(r=>{ const v=r.node[field]; if(v)m[v]=(m[v]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
const _INS_CACHE={};
function indicationInsight(area,disease){
  const key=area+'||'+disease;
  if(key in _INS_CACHE) return _INS_CACHE[key];
  const rows=collectIndication(area,disease);
  let out=null;
  if(rows.length){
    const leader=rows.filter(r=>!r.node.neg).sort((a,b)=>frontierScore(b)-frontierScore(a))[0]||null;
    const advancing=rows.filter(r=>r.node.pos&&!r.node.neg).length;
    const setbacks=rows.filter(r=>r.node.neg).length;
    const crowded=tally(rows,'target').filter(([,c])=>c>=3);
    const modsPresent=new Set(tally(rows,'modality').map(x=>x[0]));
    const whitespace=ALL_MODALITIES.filter(m=>!modsPresent.has(m));
    out={area,disease,rows,leader,advancing,setbacks,crowded,whitespace};
  }
  _INS_CACHE[key]=out; return out;
}
function leaderBits(r){
  const n=r.node, bits=[];
  if(n.target)bits.push(n.target);
  if(n.modality)bits.push(n.modality);
  if(n.mkt!=null)bits.push(n.mktLabel);
  else if(n.stage && n.stageRank>=5)bits.push(n.stage);
  const co=n.company || stripTags(n.title).split(/[:’']/)[0].slice(0,26);
  return {co, sub:bits.join(' · ')};
}
// one-line, cross-week synthesis shown under an indication (focused column only via CSS)
// Group an indication's assets into "concepts" (by target, else modality) and
// classify each as rising / contested / struggling / emerging over time.
// a story is a "win" if it has positive data OR is an approved/marketed asset
function assetWin(n){ return !n.neg && (n.pos || (n.stageRank||0)>=6); }
function conceptTrajectories(rows){
  const g={};
  rows.forEach(r=>{
    const n=r.node;
    const key=n.target || n.modality || 'Other';
    (g[key]=g[key]||{key,items:[],pos:0,neg:0}).items.push(r);
    if(n.neg)g[key].neg++; else if(assetWin(n))g[key].pos++;
  });
  const arr=Object.values(g).map(c=>{
    let cls,tag,ar;
    if(c.pos>0&&c.neg===0){cls='rising';tag='validating';ar='▲';}
    else if(c.pos>0&&c.neg>0){cls='contested';tag='contested';ar='◆';}
    else if(c.neg>0&&c.pos===0){cls='falling';tag='struggling';ar='▼';}
    else{cls='emerging';tag='emerging';ar='○';}
    c.items.sort((a,b)=>b.week.meta.sort-a.week.meta.sort);
    return Object.assign(c,{cls,tag,ar,score:(c.pos-c.neg)*10+c.items.length});
  });
  const rank={rising:0,contested:1,falling:2,emerging:3};
  arr.sort((a,b)=> rank[a.cls]-rank[b.cls] || b.items.length-a.items.length || b.score-a.score);
  return arr;
}
// per-week sentiment, oldest->newest (the trend over time)
// Adaptive momentum over time: bin into <=10 equal time buckets by calendar
// month so the shape doesn't depend on how many weeks have accumulated.
const _MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthIdx(w){ return (w.meta.year||2000)*12 + ((w.meta.month||1)-1); }
function momentumSeries(rows){
  if(!rows.length) return {buckets:[],total:0,up:0,dn:0,unit:1};
  const idxs=rows.map(r=>monthIdx(r.week));
  const lo=Math.min(...idxs), hi=Math.max(...idxs);
  const span=hi-lo+1;
  const unit=Math.max(1, Math.ceil(span/10));      // months per bucket, <=10 buckets
  const nb=Math.ceil(span/unit);
  const buckets=[];
  for(let i=0;i<nb;i++){ const start=lo+i*unit;
    buckets.push({start,label:_MN[start%12]+(unit>3?" '"+String(Math.floor(start/12)).slice(-2):''),up:0,dn:0,neu:0,n:0}); }
  let up=0,dn=0;
  rows.forEach(r=>{ const b=buckets[Math.floor((monthIdx(r.week)-lo)/unit)];
    b.n++; if(r.node.neg){b.dn++;dn++;} else if(assetWin(r.node)){b.up++;up++;} else b.neu++; });
  return {buckets,total:rows.length,up,dn,unit};
}

// Global mechanism signal: which indications each modality / target is WINNING in
// (used for cross-indication breakthrough directions). Computed once.
let _MECH=null;
function mechSignal(){
  if(_MECH) return _MECH;
  if(!INDEX) INDEX=flatten();
  const mod={}, tgt={};
  INDEX.filter(r=>r.cat==='disease').forEach(r=>{
    const n=r.node, ind=r.crumbs[1]; if(!ind||ind==='Misc.') return;
    const win=assetWin(n);
    function add(map,key){ if(!key)return; const e=map[key]||(map[key]={wins:{},all:{}}); e.all[ind]=1; if(win)e.wins[ind]=(e.wins[ind]||0)+1; }
    add(mod,n.modality); add(tgt,n.target);
  });
  _MECH={mod,tgt}; return _MECH;
}

// segment coverage + whitespace across all assets in an indication
function segmentCoverage(rows){
  const assets=rows.filter(r=>r.node.asset);
  const cnt=(dim,val)=>assets.filter(r=>(r.node.seg&&r.node.seg[dim]||[]).includes(val)).length;
  const histo={sq:cnt('histo','squamous'), nsq:cnt('histo','non-squamous')};
  const line={early:cnt('line','early/adjuvant'),'1L':cnt('line','1L'),late:cnt('line','2L+/later')};
  const bioSel=assets.filter(r=>(r.node.seg&&r.node.seg.bio||[]).length>0).length;
  const markers={}; assets.forEach(r=>(r.node.seg&&r.node.seg.bio||[]).forEach(b=>markers[b]=(markers[b]||0)+1));
  const topMarkers=Object.entries(markers).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // whitespace heuristics
  const ws=[];
  const histoActive=histo.sq+histo.nsq;
  if(histoActive>=2){ const mx=Math.max(histo.sq,histo.nsq);
    if(histo.sq===0) ws.push('squamous (no assets)');
    else if(histo.sq<=mx*0.34) ws.push('squamous (only '+histo.sq+')');
    if(histo.nsq===0 && histo.sq>0) ws.push('non-squamous (no assets)'); }
  const lineActive=line.early+line['1L']+line.late;
  if(lineActive>=2){
    if(line.late===0) ws.push('2L+/later lines');
    if(line.early===0 && line['1L']>0) ws.push('adjuvant / earlier-stage'); }
  if(bioSel>=Math.max(2, assets.length*0.5)) ws.push('biomarker-unselected / wild-type');
  return {assets:assets.length,histo,line,bioSel,topMarkers,ws};
}

// Extract why a failed asset failed, and whether that cause looks solvable
// (an engineering/selectivity problem) vs a target/biology invalidation.
const _SOLVABLE_RX=/(off-?target|selectivit|toxicit|\btox\b|tolerab|safety|liability|\bPK\b|exposure|half-life|delivery|formulation|CNS penetrat|narrow therapeutic)/i;
const _TARGETRISK_RX=/(did ?n[o’']?t meet|missed? (?:the )?(?:primary|endpoint)|failed (?:to meet|its|the)|lack of efficacy|no (?:clinical )?benefit|futility|not efficacious)/i;
function failureReason(n){
  const b=stripTags(n.title)+' '+(n.details?collectText(n.details):'');
  const due=b.match(/due to ([^.,;:]{4,46})/i);
  let reason=due?due[1].trim():'';
  const sol=_SOLVABLE_RX.test(b), risk=_TARGETRISK_RX.test(b);
  if(!reason){ const m=b.match(_SOLVABLE_RX)||b.match(_TARGETRISK_RX); reason=m?m[0]:''; }
  return {reason, solvable: sol && !risk};
}
// Strategic breakthrough angles grounded in frontier gaps, failures and transfer.
function breakthroughDirections(area,disease,rows,cons,leader,I,cov){
  const dirs=[];
  const sig=mechSignal();
  const present=new Set(rows.map(r=>r.node.modality).filter(Boolean));
  // 1) Serve the underserved subpopulation (frontier whitespace)
  if(cov && cov.ws.length){
    const seg=cov.ws[0];
    const bioNote=cov.bioSel>=Math.max(2,cov.assets*0.5)?' Most assets are biomarker-selected, so a drug for the molecularly-unselected majority is a large, open population.':'';
    dirs.push({cls:'subpop',title:'Own an underserved subpopulation',
      body:'The frontier concentrates elsewhere and leaves <b>'+escapeHtml(cov.ws.slice(0,2).join(' and '))+'</b> thin. '+
        'A drug <b>purpose-built for '+escapeHtml(seg.replace(/ \(.*/,''))+'</b> — not a subgroup of a broad trial — could own a real unmet need in '+escapeHtml(disease)+'.'+bioNote});
  }
  // 2) Revisit a target that failed for a SOLVABLE reason (valid target, wrong execution)
  const rescue=rows.filter(r=>r.node.neg && r.node.target).map(r=>{
    const f=failureReason(r.node); return f.solvable?{t:r.node.target,mod:r.node.modality,reason:f.reason,co:r.node.company}:null;
  }).filter(Boolean)[0];
  if(rescue){
    const cause=rescue.reason
      ? (' stalled here on <b>'+escapeHtml(rescue.reason)+'</b> — an engineering/selectivity problem, not proof the target is wrong.')
      : (' stalled here for execution reasons, not target invalidation.');
    dirs.push({cls:'rescue',title:'Rescue a target that failed on execution',
      body:'<b>'+escapeHtml(rescue.t)+'</b>'+(rescue.mod?(' ('+escapeHtml(rescue.mod)+')'):'')+cause+
        ' A cleaner, better-delivered or more selective agent against '+escapeHtml(rescue.t)+' could still be best-in-class.'});
  }
  // 3) Transfer a distinct PLATFORM proven ELSEWHERE but untried here
  const transfers=ALL_MODALITIES.filter(m=>NOVEL_PLATFORMS.has(m)&&!present.has(m)).map(m=>{
    const e=sig.mod[m]; if(!e)return null;
    const wonIn=Object.keys(e.wins).filter(x=>x!==disease);
    return wonIn.length?{m,wonIn,n:wonIn.length}:null;
  }).filter(Boolean).sort((a,b)=>b.n-a.n).slice(0,1);
  transfers.forEach(t=>{
    dirs.push({cls:'transfer',title:'Transfer a proven platform · '+t.m,
      body:'<b>'+escapeHtml(t.m)+'</b> is validating in '+t.n+' other indication'+(t.n>1?'s':'')+
        ' (e.g. '+escapeHtml(t.wonIn.slice(0,3).join(', '))+') but is <b>untried in '+escapeHtml(disease)+
        '</b> — a chance to define the class rather than crowd an existing target.'});
  });
  // candidate platform modalities to name concretely (validating elsewhere, untried here)
  const candMods=ALL_MODALITIES.filter(m=>NOVEL_PLATFORMS.has(m)&&!present.has(m)&&sig.mod[m]&&Object.keys(sig.mod[m].wins).some(x=>x!==disease));
  // 4) Escape the crowded target — name concrete alternative modalities
  if(I&&I.crowded.length){
    const c=I.crowded[0];
    const domMod=(tally(rows.filter(r=>(r.node.target===c[0])),'modality')[0]||[])[0];
    const alts=candMods.slice(0,3);
    const altTxt=alts.length?('Concretely, try a <b>'+escapeHtml(alts.join(', '))+'</b> against '+escapeHtml(c[0])+
      ' or a resistance node downstream of it'+(domMod?(', rather than yet another '+escapeHtml(domMod)):'')+'.'):
      'Differentiate with a mechanism that overcomes resistance to the current agents, not another '+escapeHtml(domMod||c[0])+'.';
    dirs.push({cls:'crowd',title:'Escape the crowded '+c[0],
      body:'<b>'+escapeHtml(c[0])+'</b> is saturated ('+c[1]+' assets'+(domMod?', mostly '+escapeHtml(domMod):'')+'). A me-too won’t differentiate. '+altTxt});
  }
  // 5) Beat the leader — name the benchmark and the easiest axis
  if(leader){
    const n=leader.node, lb=[n.modality,n.target].filter(Boolean).join('/');
    const ax=beatableAxis(rows,cov);
    const bar=n.efficacy?('Its published bar is <b>'+escapeHtml(n.efficacy)+'</b> — beat it decisively (a markedly better number, not a few points). '):'';
    dirs.push({cls:'leader',title:'Beat the leader where it is weakest',
      body:'The frontier is <b>'+escapeHtml(n.company||stripTags(n.title).slice(0,24))+'</b>'+(lb?' ('+escapeHtml(lb)+')':'')+'. '+bar+
        'Easiest axis to beat: <b>'+escapeHtml(ax.axis)+'</b> — '+ax.why+'. Build specifically for that, not a broad me-too.'});
  }
  // prioritise the most decision-useful angles
  const prio={subpop:0,leader:1,rescue:2,crowd:3,transfer:4};
  dirs.sort((a,b)=>(prio[a.cls]-prio[b.cls]));
  return dirs.slice(0,4);
}
// Which performance axis is easiest to beat, from the evidence.
function beatableAxis(rows,cov){
  const txt=rows.map(r=>stripTags(r.node.title)+' '+(r.node.details?collectText(r.node.details):'')).join(' ');
  if(/resist|relaps|acquired|escape|rebound|progress(?:ion|ed) on/i.test(txt))
    return {axis:'acquired resistance', why:'assets here already cite resistance/relapse, so durable control is unmet'};
  if(cov && cov.bioSel>=Math.max(2,cov.assets*0.5))
    return {axis:'patient reach', why:'most assets are biomarker-selected, leaving the unselected majority untreated'};
  if(/brain|CNS|mets|metasta/i.test(txt))
    return {axis:'CNS / hard-to-reach disease', why:'CNS and metastatic compartments are poorly served by current agents'};
  return {axis:'depth & durability of response', why:'responses are not yet deep or durable enough to approach cure'};
}

const _STAGE_SHORT={'Phase 3':'Ph3','Phase 2':'Ph2','Phase 1':'Ph1','Filed':'filed','Preclinical':'preclinical','Approved':'','Marketed':'','Platform/other':''};

function breakthroughPrompt(area,disease,rows){

  const untried=ALL_MODALITIES.filter(m=>!modsPresent[m]);
  const crowded=Object.entries(tgtsPresent).filter(([,c])=>c>=3).map(([t])=>t);
  let p='';
  p+='You are a biotech R&D strategist with deep medicinal-chemistry and translational-biology expertise. ';
  p+='Help me invent TRULY NOVEL, non-incremental drug concepts for '+disease+' ('+area+') that could be dramatically superior to everything currently in development.\n\n';

    p+='- '+strip(n.title).slice(0,220);
    const tags=[n.modality,n.target&&('target '+n.target),n.stage,n.efficacy&&('efficacy bar: '+n.efficacy),n.mkt!=null?('~'+n.mktLabel+' peak'):null].filter(Boolean);
    if(tags.length)p+='  ['+tags.join(', ')+']';

  });
  p+='\nWHAT HAS FAILED OR STALLED here (learn from these — do not repeat them):\n';
  if(grave.length) grave.forEach(r=>{ p+='- '+strip(r.node.title).slice(0,200)+'\n'; });
  else p+='- (no failures captured yet in this window)\n';
  p+='\nMECHANISM LANDSCAPE:\n';
  p+='- Targets in play: '+(Object.entries(tgtsPresent).map(([t,c])=>t+'×'+c).join(', ')||'n/a')+'\n';
  if(crowded.length)p+='- CROWDED targets (≥3 assets): '+crowded.join(', ')+' — a me-too here is unlikely to differentiate.\n';
  p+='- Modalities in play: '+(Object.entries(modsPresent).map(([m,c])=>m+'×'+c).join(', ')||'n/a')+'\n';
  p+='- Modalities NOT yet applied to this indication (possible white space): '+untried.slice(0,14).join(', ')+'\n';
  if(mkts.length)p+='- Market-size signal: $'+Math.round(Math.min(...mkts))+'M–$'+Math.round(Math.max(...mkts))+'M peak across assets.\n';
  // cross-indication transfer signal — modalities winning elsewhere, untried here
  const sig=mechSignal();
  const transfer=untried.filter(m=>NOVEL_PLATFORMS.has(m)).map(m=>{ const e=sig.mod[m]; if(!e)return null;
    const w=Object.keys(e.wins).filter(x=>x!==disease); return w.length?(m+' (validating in '+w.slice(0,3).join(', ')+')'):null; }).filter(Boolean).slice(0,5);
  if(transfer.length)p+='- CROSS-INDICATION SIGNAL — modalities proven in OTHER diseases but untried here: '+transfer.join('; ')+'.\n';
  // segment coverage + whitespace + rescuable failures
  const cov=segmentCoverage(rows);
  p+='- POPULATION COVERAGE — non-squamous '+cov.histo.nsq+' / squamous '+cov.histo.sq+' assets; lines 1L '+cov.line['1L']+' / 2L+ '+cov.line.late+(cov.line.early?' / adjuvant '+cov.line.early:'')+'; biomarker-selected '+cov.bioSel+' of '+cov.assets+(cov.topMarkers.length?(' ('+cov.topMarkers.slice(0,5).map(([m,c])=>m+(c>1?'×'+c:'')).join(', ')+')'):'')+'.\n';
  if(cov.ws.length)p+='- WHITESPACE SUBPOPULATIONS the frontier under-serves: '+cov.ws.join('; ')+'.\n';
  const rescues=rows.filter(r=>r.node.neg&&r.node.target).map(r=>{const f=failureReason(r.node);return f.solvable?(r.node.target+(f.reason?' (failed on '+f.reason+')':'')):null;}).filter(Boolean);
  if(rescues.length)p+='- RESCUABLE TARGETS — failed here for execution/selectivity reasons, not target invalidation (the target may still be valid with better engineering): '+[...new Set(rescues)].slice(0,5).join('; ')+'.\n';
  p+='\nYOUR TASK — propose 3 breakthrough concepts that could be FAR superior to the frontier above. Be a discerning scientist, not a brainstorm generator.\n';
  p+='Hard rules:\n';
  p+='- Do NOT propose incremental me-toos: no next-gen same-target, swapped ADC payload, or another bispecific against targets already listed.\n';
  p+='- Do NOT simply combine two targets/mechanisms that already work — that is the obvious move and rarely a breakthrough. If you invoke a combination, justify a specific synergy that solves a named failure mode, not additive effect.\n';
  p+='- Every concept must name the SPECIFIC unmet need it addresses — a patient subpopulation (line, histology, biomarker status) or disease axis the frontier assets above do NOT already serve well. Prefer the whitespace subpopulations listed.\n';
  p+='- Anchor each idea in ONE (ideally a combination) of: (a) a whitespace subpopulation the frontier ignores, (b) a rescuable target that failed on execution not biology — propose the engineering fix, (c) a modality absent here but proven elsewhere (cross-indication signal), or (d) a biological insight about '+disease+' the field is ignoring.\n\n';
  p+='For each concept give:\n';
  p+='1. Target patient & unmet need — the specific population the frontier underserves, and why it matters.\n';
  p+='2. Core insight — the non-obvious biology or engineering insight others are missing, specific to '+disease+'.\n';
  p+='3. Mechanism — target + modality + how it works, concretely enough to design the first experiment.\n';
  p+='4. Why step-change (not incremental) — the single axis on which it could be 5–10× better than the named frontier leader (depth, durability/cure, resistance, therapeutic index, or reaching patients the frontier cannot), and the quantitative bar to beat.\n';
  p+='5. Why now — the enabling technology or biological understanding that makes this feasible today but wasn\'t 3 years ago.\n';
  p+='6. Killer risk — the one thing most likely to sink it, and the fastest, cheapest experiment to de-risk it.\n\n';
  p+='Then stress-test your own ideas: for each, state honestly whether it is truly novel or a disguised incremental, and cut any that are incremental. End with the ONE concept you would fund first and the specific reason it wins.';
  return p;
}

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }

function doSearch(q){
  state.search=q.trim();
  document.getElementById('searchWrap').classList.toggle('has', !!state.search);
  if(state.search) renderSearch(state.search); else renderCarousel();
}
document.getElementById('search').addEventListener('input',e=>doSearch(e.target.value));
document.getElementById('clearSearch').addEventListener('click',()=>{document.getElementById('search').value='';doSearch('');document.getElementById('search').focus();});
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); state.cat=t.dataset.cat;
  if(state.search)renderSearch(state.search); else renderCarousel();
});
document.getElementById('navPrev').addEventListener('click',()=>navTo(state.focus-1));
document.getElementById('navNext').addEventListener('click',()=>navTo(state.focus+1));
document.getElementById('tglAreas').addEventListener('click',()=>toggleLevel('area'));
document.getElementById('tglInd').addEventListener('click',()=>toggleLevel('grp'));
document.getElementById('tglDetails').addEventListener('click',()=>toggleLevel('story'));
document.getElementById('fltBig').addEventListener('click',()=>{
  state.bigOnly=!state.bigOnly;
  document.getElementById('fltBig').classList.toggle('on',state.bigOnly);
  if(state.search) renderSearch(state.search); else renderCarousel();
});
document.getElementById('pinClear').addEventListener('click',clearPin);
window.addEventListener('keydown',e=>{
  if(document.activeElement===document.getElementById('search'))return;
  if(state.search)return;
  if(e.key==='ArrowLeft')navTo(state.focus-1);
  if(e.key==='ArrowRight')navTo(state.focus+1);
});
window.addEventListener('resize',()=>{setHdrH(); if(!state.search){layout(); if(state.pin) alignPinned(false);}});

/* ---------- init ---------- */
function init(){
  if(!WEEKS.length){document.getElementById('track').innerHTML='<div class="empty">No data. Run parse_notes.py to generate the dashboard.</div>';return;}
  document.getElementById('rangeLabel').textContent=WEEKS[0].meta.label+'  —  '+WEEKS[WEEKS.length-1].meta.label;
  document.getElementById('genLabel').textContent=WEEKS.length+' weeks indexed';
  setHdrH();
  if(!INDEX)INDEX=flatten();   // assigns stable _uid to every story node before first render
  renderCarousel();
}
init();
})();
</script>
