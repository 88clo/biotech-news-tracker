name: Rebuild tracker
on:
  push:
    paths: ['notes/**', 'template.html', 'parse_notes.py', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Rebuild index.html from notes
        run: python3 parse_notes.py notes --html-template template.html --html-out index.html
      - name: Commit rebuilt site if it changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Auto-rebuild tracker from notes [skip ci]"
            git push
          else
            echo "No change to index.html"
          fi
